name: atrium

# Compila o Atrium modificado (submódulo atrium-desktop, ramo vpn) e põe o Atrium.exe na Release mais recente,
# que é de onde o instalar.ps1 o descarrega.
#  - à segunda-feira: avança o submódulo para o fim do ramo vpn; só compila se houver novidades
#  - ao mudar o submódulo em main, ou à mão (Run workflow): compila sempre
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [atrium-desktop]

permissions:
  contents: write

jobs:
  atrium:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Avança o submódulo para o fim do ramo vpn
        id: sub
        shell: bash
        run: |
          antes=$(git -C atrium-desktop rev-parse HEAD)
          git submodule update --remote atrium-desktop
          depois=$(git -C atrium-desktop rev-parse HEAD)
          if [ "$antes" != "$depois" ]; then
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
            git config user.name "Gonçalo Leite"
            git config user.email "207007742+Gleite05@users.noreply.github.com"
            git commit -am "Atualiza o Atrium modificado"
            git push
          else
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila o Atrium.exe
        if: github.event_name != 'schedule' || steps.sub.outputs.mudou == 'sim'
        shell: pwsh
        working-directory: atrium-desktop
        run: |
          cmake --preset win-x64 -S native -B native/build/win-x64 -DATRIUM_DEVELOPMENT=OFF -DATRIUM_BUILD_TESTS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native/build/win-x64 --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Põe o Atrium.exe na Release
        if: github.event_name != 'schedule' || steps.sub.outputs.mudou == 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName -q .tagName)
          gh release upload "$tag" atrium-desktop/native/build/win-x64/Release/Atrium.exe --clobber
          echo "Atrium.exe atualizado na release $tag"
