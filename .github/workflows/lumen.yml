name: lumen

# Compila o Lumen inteiro e faz o instalador (Lumen-Setup-<versão>.exe).
#  - em cada push para main: compila e guarda o instalador como artefacto
#  - numa etiqueta v* (ex.: v1.0.0): publica a release no GitHub com o instalador
#  - à segunda-feira: traz as novidades da barra (submódulo atrium-desktop, ramo vpn) e compila
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lumen:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Novidades da barra (semanal)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          antes=$(git -C atrium-desktop rev-parse HEAD)
          git submodule update --remote atrium-desktop
          if [ "$antes" != "$(git -C atrium-desktop rev-parse HEAD)" ]; then
            git config user.name "Gonçalo Leite"
            git config user.email "207007742+Gleite05@users.noreply.github.com"
            git commit -am "Barra: novidades do ramo vpn"
            git push
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: atrium-desktop/global.json

      - name: Versão
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $v) { throw "A etiqueta $env:GITHUB_REF_NAME não bate com o VERSION ($v)" }
          "versao=$v" >> $env:GITHUB_OUTPUT

      - name: Barra com a marca Lumen
        shell: pwsh
        run: ./barra/marca-lumen.ps1 -Fonte atrium-desktop -Destino build/barra -Versao ${{ steps.v.outputs.versao }} -Marca marca

      - name: Compila a barra (nativo + definições)
        shell: pwsh
        run: ./build/barra/tools/build.ps1

      - name: Compila o Lumen (Central, Painel, Clássico)
        shell: pwsh
        run: ./compilar.ps1 -Saida saida/lumen

      - name: Empacota
        shell: pwsh
        run: ./instalador/empacotar.ps1 -Barra build/barra/dist/Lumen -Lumen saida/lumen

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersao=${{ steps.v.outputs.versao }}" "/DPacote=..\saida\pacote" instalador/Lumen.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item saida/Lumen-Setup-*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Lumen-Setup-${{ steps.v.outputs.versao }}
          path: saida/Lumen-Setup-*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.v.outputs.versao }}
          notas=instalador/notas/$v.md
          if [ -f "$notas" ]; then arg=(--notes-file "$notas"); else arg=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "saida/Lumen-Setup-$v.exe" --title "Lumen $v" "${arg[@]}"
