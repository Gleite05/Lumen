<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><title>Central</title>
<style>
:root{--g:rgba(10,30,20,.40);--b:rgba(255,255,255,.14);--t:#eafff2;--m:rgba(234,255,242,.62);--ok:#7dffb0;--warn:#ffd36b;--bad:#ff7a7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;cursor:default}
body{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;color:var(--t);background:#06170f no-repeat;-webkit-font-smoothing:antialiased}
.panel{position:absolute;border-radius:28px;background:var(--g);border:1px solid var(--b);backdrop-filter:blur(26px) saturate(140%);box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);padding:26px 28px;margin:40px 0 0 40px}
h3{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin-bottom:16px;display:flex;align-items:center;gap:10px}
h3 span{margin-left:auto;font-size:12px;letter-spacing:0;text-transform:none;font-weight:400}
.date{position:absolute;left:40px;top:56px}
.date .d{font-size:96px;font-weight:200;letter-spacing:-.02em;line-height:1}
.date .sub{font-size:26px;font-weight:300;color:var(--m);margin-top:10px}
.srv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.s{border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:14px 16px;transition:background .15s,transform .15s}
.s[data-acao]:hover,.sh a:hover,.chip:hover,.s[data-acao].hov,.sh a.hov,.chip.hov{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.s b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden}
.s b:before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--m);opacity:.5}
.s.ok b:before{background:var(--ok);box-shadow:0 0 12px var(--ok);opacity:1}
.s.w b:before{background:var(--warn);box-shadow:0 0 12px var(--warn);opacity:1}
.s.x b:before{background:var(--bad);box-shadow:0 0 12px var(--bad);opacity:1}
.s.x{background:rgba(255,122,122,.10);border-color:rgba(255,122,122,.3)}
.s small{display:flex;font-size:12px;color:var(--m);margin-top:6px;white-space:nowrap}
.s small span{overflow:hidden;text-overflow:ellipsis;margin-right:8px}.s small em{margin-left:auto;flex:none;font-style:normal;font-variant-numeric:tabular-nums}
.ag{display:flex;flex-direction:column;gap:12px}
.ev{display:flex;gap:14px;align-items:center;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.05)}
.ev.now{background:rgba(125,255,176,.12);border:1px solid rgba(125,255,176,.3)}
.ev.past{opacity:.45}
.ev .h{font-size:20px;font-weight:300;width:62px;flex:none;font-variant-numeric:tabular-nums}
.ev .t{font-size:15px;font-weight:600;min-width:0}.ev .t small{display:block;font-weight:400;color:var(--m);font-size:12px;margin-top:2px}
.ev .t,.ev .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vazio{font-size:14px;color:var(--m);padding:10px 2px}
.net{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k{border-radius:16px;background:rgba(255,255,255,.05);padding:14px 16px;min-width:0}
.k small{font-size:12px;color:var(--m)} .k div{font-size:22px;font-weight:300;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vpn{grid-column:1/3;display:flex;align-items:center;gap:14px}
.vpn.on{background:rgba(125,255,176,.1);border:1px solid rgba(125,255,176,.25)}
.vpn .sw{margin-left:auto;flex:none;width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.vpn .sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.vpn.on .sw{background:var(--ok)} .vpn.on .sw:after{left:25px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);transition:background .15s}
.sh{display:flex;gap:12px;flex-wrap:wrap}
.sh a{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;transition:background .15s,transform .15s}
.sh a svg{width:28px;height:28px;stroke:var(--t);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.mus{display:flex;gap:16px;align-items:center}
.capa{width:84px;height:84px;flex:none;border-radius:16px;background:linear-gradient(135deg,#3a8055,#0d2c1d) center/cover}
.mus .tt{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus .ar{color:var(--m);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{margin-top:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.2)} .prog i{display:block;height:4px;border-radius:2px;background:#fff;width:0}
.ctl{display:flex;gap:6px;margin-top:10px}
.ctl button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.ctl button:hover,.ctl button.hov{background:rgba(255,255,255,.2)}
.ctl svg{width:16px;height:16px;fill:var(--t)}
[data-acao],[data-vpn],.ctl button{cursor:pointer}
</style></head><body>

<div class="date"><div class="d" id="dia">&nbsp;</div><div class="sub" id="sub">&nbsp;</div></div>

<div class="panel" style="left:0;top:220px;width:820px"><h3>Servidores <span id="srvResumo"></span></h3><div class="srv" id="srv"></div></div>
<div class="panel" style="left:840px;top:220px;width:470px"><h3>Hoje <span>Outlook</span></h3><div class="ag" id="ag"><div class="vazio">A ler a agenda…</div></div></div>
<div class="panel" style="left:0;top:560px;width:400px"><h3>Rede</h3><div class="net">
 <div class="k vpn" id="vpn"><div style="min-width:0"><small>VPN</small><div id="vpnNome" style="font-size:18px;font-weight:600">—</div><small id="vpnInfo"></small><div class="chips" id="vpnChips"></div></div><div class="sw" id="vpnSw"></div></div>
 <div class="k"><small>IP público</small><div id="ip">—</div></div>
 <div class="k"><small>Internet</small><div id="inet">—</div></div>
</div></div>
<div class="panel" style="left:420px;top:560px;width:400px"><h3>Atalhos</h3><div class="sh" id="sh"></div></div>
<div class="panel" style="left:840px;top:560px;width:470px"><h3>A tocar</h3>
 <div class="mus"><div class="capa" id="capa"></div><div style="min-width:0;flex:1"><div class="tt" id="tt">Nada a tocar</div><div class="ar" id="ar">&nbsp;</div>
 <div class="prog"><i id="pr"></i></div>
 <div class="ctl"><button data-m="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button><button data-m="play" aria-label="Tocar ou pausar"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button><button data-m="next" aria-label="Seguinte"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button></div>
 </div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const post=o=>window.chrome.webview.postMessage(o);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICONES={server:'<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
 camera:'<path d="M15 10l4.5-2.5v9L15 14"/><rect x="3" y="6" width="12" height="12" rx="2"/>',
 home:'<path d="M5 12l7-7 7 7M7 10v9h10v-9"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 terminal:'<path d="M5 7l5 5-5 5M12 19h7"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3 3 7 3s7-1.3 7-3"/>'};
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let tempo='',cfgAtalhos=[];

function relogio(){const d=new Date();$('dia').textContent=DIAS[d.getDay()]+', '+d.getDate();$('sub').textContent=MESES[d.getMonth()]+(tempo?' · '+tempo:'');}
setInterval(relogio,30000);relogio();

function dur(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' h '+m+' min':m+' min';}
function mmss(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

const H={
 fundo(m){const b=document.body.style;b.backgroundImage=`url("${m.url}")`;b.backgroundPosition=`${-m.x}px ${-m.y}px`;b.backgroundSize=`${m.w}px ${m.h}px`;},
 servidores(l){const ok=l.filter(s=>s.ok).length;$('srvResumo').textContent=ok+' de '+l.length+' a responder';
  $('srv').innerHTML=l.map(s=>{const c=!s.ok?'x':s.ms>150?'w':'ok';return `<div class="s ${c}" ${s.acao?`data-acao="${esc(s.acao)}"`:''}><b>${esc(s.nome)}</b><small><span>${esc(s.sub)}</span><em>${s.ok?(s.ms<1?'&lt;1':s.ms)+' ms':'sem resposta'}</em></small></div>`}).join('');},
 agenda(a){const el=$('ag');if(!a.aberto){el.innerHTML='<div class="vazio">Abre o Outlook para veres as reuniões de hoje.</div>';return}
  if(!a.eventos.length){el.innerHTML='<div class="vazio">Sem reuniões hoje.</div>';return}
  let prox=a.eventos.findIndex(e=>e.b>0);
  el.innerHTML=a.eventos.map((e,i)=>{const now=i===prox,past=e.b<=0;let info=esc(e.local);
   if(now){const q=e.a>0?'daqui a '+dur(e.a*60):'a decorrer até '+e.fim;info=q+(e.local?' · '+esc(e.local):'');}
   return `<div class="ev ${now?'now':''} ${past?'past':''}"><div class="h">${e.ini}</div><div class="t">${esc(e.titulo)}<small>${info||'&nbsp;'}</small></div></div>`}).slice(Math.max(0,prox-1),Math.max(0,prox-1)+4).join('');},
 rede(r){$('ip').textContent=r.ip||'—';$('inet').textContent=r.internet?r.ms+' ms':'sem ligação';},
 vpn(v){const on=!!v.ligada,ocup=v.ocupada||{};const el=$('vpn');el.classList.toggle('on',on);
  const nomeOcup=Object.keys(ocup)[0];
  $('vpnNome').textContent=on?v.ligada:(nomeOcup||'Desligada');
  $('vpnInfo').textContent=nomeOcup?ocup[nomeOcup]:on?'ligada há '+dur(v.desde):'escolhe uma para ligar';
  $('vpnSw').dataset.vpn=on?v.ligada:'';$('vpnSw').style.visibility=on?'visible':'hidden';
  $('vpnChips').innerHTML=on||nomeOcup?'':v.entradas.map(n=>`<span class="chip" data-vpn="${esc(n)}" data-ligar="1">${esc(n)}</span>`).join('');},
 tempo(t){tempo=t.temp+'° '+t.ceu;relogio();},
 atalhos(l){cfgAtalhos=l;$('sh').innerHTML=l.map(a=>`<a data-acao="${esc(a.acao)}"><svg viewBox="0 0 24 24">${ICONES[a.icone]||ICONES.globe}</svg>${esc(a.nome)}</a>`).join('');},
 musica(m){if(!m.tem){$('tt').textContent='Nada a tocar';$('ar').innerHTML='&nbsp;';$('capa').style.backgroundImage='';$('pr').style.width=0;return}
  $('tt').textContent=m.titulo;$('ar').textContent=m.artista;$('capa').style.backgroundImage=m.capa?`url("${m.capa}")`:'';
  $('pr').style.width=(m.dur?100*m.pos/m.dur:0)+'%';
  $('playIco').innerHTML=m.aTocar?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';}
};
// O rato chega pelo Central (os painéis estão por baixo dos ícones do ambiente de trabalho).
let hovEl=null;
function Rato(m){
 if(m.ev==='sair'){if(hovEl){hovEl.classList.remove('hov');hovEl=null}return}
 const t=document.elementFromPoint(m.x,m.y);
 const el=t&&t.closest('[data-acao],[data-vpn],[data-m]');
 if(m.ev==='mover'){if(el!==hovEl){if(hovEl)hovEl.classList.remove('hov');hovEl=el;if(el)el.classList.add('hov')}}
 else if(m.ev==='clique'&&t)t.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:m.x,clientY:m.y}));
}
window.chrome.webview.addEventListener('message',e=>{const m=e.data;if(m.tipo==='fundo')H.fundo(m);else if(m.tipo==='rato')Rato(m);else if(H[m.tipo])H[m.tipo](m.dados);});
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-acao]');if(a){post({acao:'abrir',alvo:a.dataset.acao});return}
 const v=e.target.closest('[data-vpn]');if(v&&v.dataset.vpn){post({acao:'vpn',nome:v.dataset.vpn,ligar:v.dataset.ligar?'True':'False'});return}
 const b=e.target.closest('[data-m]');if(b)post({acao:'media',cmd:b.dataset.m});
});
document.addEventListener('contextmenu',e=>e.preventDefault());
post({acao:'pronto'});
</script></body></html>
