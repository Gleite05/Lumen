<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><title>Lumen</title>
<style>
:root{--bg1:#08140e;--bg2:#04100a;--acc:#6aba85;--acc2:#2f8a58;--t:#eef7f1;--m:rgba(238,247,241,.6);--f:rgba(238,247,241,.38);--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.085);--line:rgba(255,255,255,.09);--ok:#7dffb0;--bad:#ff7a7a;--inp:rgba(0,0,0,.22)}
body.claro{--t:#142233;--m:rgba(20,34,51,.62);--f:rgba(20,34,51,.4);--card:rgba(255,255,255,.5);--card2:rgba(255,255,255,.72);--line:rgba(20,34,51,.1);--ok:#13985a;--bad:#d64545;--inp:rgba(255,255,255,.7)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;color:var(--t);background:linear-gradient(170deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased;user-select:none;display:flex}
#ondas{position:fixed;left:0;bottom:0;width:100%;height:34vh;pointer-events:none;opacity:.16;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 60%)}
button,input,select{font:inherit;color:inherit}
aside{position:relative;z-index:1;width:250px;flex:none;padding:26px 14px 18px;display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.16);border-right:1px solid var(--line);backdrop-filter:blur(30px)}
body.claro aside{background:rgba(255,255,255,.35)}
.marca{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.marca img{width:42px;height:42px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.marca b{display:block;font:600 21px/1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.01em}
.marca small{color:var(--f);font-size:12px}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--m);cursor:pointer;transition:background .15s,color .15s;font-weight:500}
nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:var(--card);color:var(--t)}
nav a.on{background:var(--card2);color:var(--t);box-shadow:inset 0 0 0 1px var(--line)}
nav a.on svg{stroke:var(--acc)}
.rodape{margin-top:auto;padding:12px;font-size:12px;color:var(--f);display:flex;align-items:center;gap:8px}
.ponto{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.ponto.off{background:var(--bad);box-shadow:0 0 10px var(--bad)}
main{position:relative;z-index:1;flex:1;overflow-y:auto;padding:34px 44px 60px}
main::-webkit-scrollbar{width:10px}main::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid transparent;background-clip:padding-box}
.pag{max-width:880px;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font:600 30px/1.15 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.02em;margin-bottom:6px}
.lead{color:var(--m);font-size:15px;margin-bottom:26px;max-width:640px}
h2{font:600 13px/1 "Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--f);margin:30px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(30px) saturate(140%);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.lista>.item{display:flex;align-items:center;gap:16px;padding:16px 20px;border-top:1px solid var(--line)}
.lista>.item:first-child{border-top:0}
.item .tx{flex:1;min-width:0}.item .tx>b{display:block;font-weight:600}.item .tx small b{font-weight:700}.item .tx small{display:block;color:var(--m);font-size:12.5px;margin-top:2px}
.ico{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--card2)}
.ico svg{width:19px;height:19px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sw{position:relative;width:46px;height:27px;flex:none;border-radius:14px;background:rgba(127,127,127,.35);cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--acc)}.sw.on:after{left:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--card);border-color:var(--acc)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);border-color:transparent;color:#06140c}
body.claro .btn.pri{color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.peq{padding:6px 11px;font-size:13px;border-radius:10px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.so{padding:7px;border-radius:10px}
input[type=text],input[type=time],input[type=date],input[type=number],select{background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:none;min-width:0;transition:border-color .15s}
input:focus,select:focus{border-color:var(--acc)}
select option{background:#1b2420;color:#fff}
input::-webkit-calendar-picker-indicator{filter:invert(var(--inv,1));opacity:.6}
body.claro{--inv:0}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.hero .prev{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:16/10;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hero .prev svg{display:block;width:100%;height:100%}
.hero .prev .lbl{position:absolute;left:20px;top:16px;font:200 44px/1 "Segoe UI Variable Display","Segoe UI",sans-serif;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.hero .prev .lbl small{display:block;font-size:15px;font-weight:400;opacity:.8;margin-top:6px}
.estado{padding:22px;display:flex;flex-direction:column;gap:14px}
.estado .l{display:flex;align-items:center;gap:10px;font-weight:500}
.estado .l span{margin-left:auto;color:var(--m);font-weight:400;font-size:13px}
.big{font:300 46px/1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.02em}
.barra-prog{height:6px;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}.barra-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:3px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tema{border-radius:18px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;background:var(--card)}
.tema:hover{transform:translateY(-2px)}.tema.on{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.tema svg{display:block;width:100%;aspect-ratio:16/10}
.tema div{padding:10px 14px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.tema div i{width:20px;height:20px;border-radius:50%;background:var(--acc);display:none;place-items:center}
.tema.on div i{display:grid}.tema div i:after{content:"";width:9px;height:5px;border-left:2px solid #06140c;border-bottom:2px solid #06140c;transform:rotate(-45deg) translate(1px,-1px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px}
.op{padding:16px 18px;border-radius:16px;cursor:pointer;border:2px solid var(--line);background:var(--card);transition:border-color .15s,background .15s}
.op:hover{background:var(--card2)}.op.on{border-color:var(--acc);background:var(--card2)}
.op b{display:block;margin-bottom:3px}.op small{color:var(--m);font-size:12.5px;display:block}
.op .cur{height:46px;display:flex;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;transition:background .15s}
.chip.on{background:var(--acc);color:#06140c;border-color:transparent}
body.claro .chip.on{color:#fff}
.chip.x{display:inline-flex;gap:8px;align-items:center;cursor:default;font-weight:500}
.chip.x button{border:0;background:none;cursor:pointer;opacity:.6;font-size:15px;line-height:1}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bloco{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
.ed{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.ed:first-child{border-top:0}
.ed .g{display:grid;gap:10px;grid-template-columns:1.1fr 1.4fr 1.3fr .6fr}
.ed .g2{display:grid;gap:10px;grid-template-columns:auto 1.1fr 160px 1.6fr auto}
.ed .cab{display:flex;align-items:center;gap:10px}
.ed label{font-size:11.5px;color:var(--f);display:block;margin:0 0 4px 2px;font-weight:600;letter-spacing:.02em}
.ed input,.ed select{width:100%}
.res{font-size:12.5px;color:var(--m);display:inline-flex;align-items:center;gap:6px}
.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
.vazio{padding:28px;text-align:center;color:var(--m)}
.icones{display:flex;gap:6px;flex-wrap:wrap}
.icones button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.icones button.on{border-color:var(--acc);background:var(--card2)}
.icones svg{width:18px;height:18px;stroke:var(--t);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sobre{display:flex;gap:26px;align-items:center;padding:28px}
.sobre img{width:110px;height:110px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.4))}
a.lk{color:var(--acc);cursor:pointer;text-decoration:none}a.lk:hover{text-decoration:underline}
#aviso{position:fixed;right:26px;bottom:24px;z-index:9;padding:11px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);backdrop-filter:blur(30px);font-weight:600;display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#aviso.on{opacity:1;transform:none}
#ocupado{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.25);backdrop-filter:blur(3px)}
#ocupado.on{display:grid}
.roda{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--acc);animation:roda .8s linear infinite}
@keyframes roda{to{transform:rotate(360deg)}}
.nota{font-size:12.5px;color:var(--f);margin-top:10px}

// ---------------------------------------------------------------- horário (o mesmo cálculo do fundo vivo)
function progresso(c,d=new Date()){
 const dias=c.dias||[1,2,3,4,5],fer=c.feriados||[];const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 let total=0,feito=0;const min=d.getHours()*60+d.getMinutes();
 for(const b of c.horario||[]){const [a,f]=b.map(x=>{const[h,m]=String(x).split(':');return(+h)*60+(+m||0)});if(!(f>a))continue;total+=f-a;feito+=Math.max(0,Math.min(f-a,min-a));}
 const livre=!dias.includes(d.getDay())||fer.includes(iso);
 return{livre,total,feito,p:livre||!total?0:feito/total};
}
function durH(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),mm=m%60;return h?h+' h'+(mm?' '+mm+' min':''):mm+' min'}

// ---------------------------------------------------------------- desenho das ondas (como o fundo vivo)
function ondas(t,p,W=1920,H=1200,so=false){
 const band=(y,f)=>`M0,${y+60} C420,${y-50} 900,${y+150} 1400,${y+10} C1900,${y-130} 1920,${y-40} 1920,${y-40}`+(f?` L1920,${H+10} L0,${H+10} Z`:'');
 let s=so?'':`<defs><linearGradient id="ceu${t.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.ceu[0]}"/><stop offset="1" stop-color="${t.ceu[1]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#ceu${t.id})"/>`;
 const Lv=p*8;
 for(let i=7;i>=0;i--){const y=H-(i+1)*125*(H/1200)+20;const v=Math.max(0,Math.min(1,Lv-i));
  s+=`<path d="${band(y-12,1)}" fill="rgba(0,0,0,${t.claro?.13:.27})"/><path d="${band(y,1)}" fill="${t.base[i]}"/>`;
  if(v>0)s+=`<path d="${band(y,1)}" fill="${t.luz[i]}" opacity="${.25+.75*v}"/>`;
  s+=`<path d="${band(y,0)}" fill="none" stroke="${t.claro?'rgba(40,80,130,':'rgba(255,255,255,'}${v>0&&v<1?.7:.12})" stroke-width="${v>0&&v<1?3:1.5}"/>`;}
 return s;
}

function aplicarTema(){const t=temaAtual(),r=document.documentElement.style;
 r.setProperty('--bg1',t.ceu[0]);r.setProperty('--bg2',t.ceu[1]);r.setProperty('--acc',t.luz[5]);r.setProperty('--acc2',t.luz[1]);
 document.body.classList.toggle('claro',!!t.claro);
 const pr=progresso(S.cfg);$('#ondas').innerHTML=ondas(t,pr.p,1920,1200,true);$('#ondas').setAttribute('viewBox','0 600 1920 600');}

  </div><p class="nota">${T('Mudar uma opção da barra reinicia-a (2–3 segundos).','Changing a bar option restarts it (2–3 seconds).','Cambiar una opción de la barra la reinicia (2–3 segundos).')}</p>`;},

 sistema(){const c=S.cfg;
  return `<h1>${T('Sistema','System','Sistema')}</h1><p class="lead">${T('Idioma, arranque e o regresso ao Windows de sempre.','Language, startup and going back to plain Windows.','Idioma, inicio y la vuelta al Windows de siempre.')}</p>
  <div class="card lista">
   ${item(IC.globe,T('Idioma','Language','Idioma'),T('Do Lumen inteiro: barra, painéis e este Painel.','For all of Lumen: bar, panels and this Panel.','De todo Lumen: barra, paneles y este Panel.'),`<select data-cfgsel="idioma"><option value="auto" ${c.idioma==='auto'?'selected':''}>${T('Automático','Automatic','Automático')}</option><option value="pt-PT" ${c.idioma==='pt-PT'?'selected':''}>Português</option><option value="en" ${c.idioma==='en'?'selected':''}>English</option><option value="es" ${c.idioma==='es'?'selected':''}>Español</option></select>`)}
   ${item(IC.power,T('Iniciar com o Windows','Start with Windows','Iniciar con Windows'),T('A barra, o fundo e os painéis arrancam quando inicias sessão.','The bar, wallpaper and panels start when you sign in.','La barra, el fondo y los paneles arrancan al iniciar sesión.'),SW(S.arranque,'data-a="arranque"'))}
   ${item(IC.tray,T('Ícone do Lumen na área de notificação','Lumen icon in the tray','Icono de Lumen en el área de notificación'),T('Acesso rápido ao Painel, à barra do Windows e ao modo clássico.','Quick access to the Panel, the Windows taskbar and classic mode.','Acceso rápido al Panel, la barra de Windows y el modo clásico.'),SW(c.icone!==false,'data-cfg="icone"'))}
  </div>
  <h2>${T('Ferramentas','Tools','Herramientas')}</h2><div class="card lista">
   ${item(IC.classic,T('Modo Windows clássico','Classic Windows mode','Modo Windows clásico'),T('Volta tudo ao Windows de origem (barra, fundo, cursores). O atalho no ambiente de trabalho traz o Lumen de volta.','Puts everything back to stock Windows (taskbar, wallpaper, cursors). The desktop shortcut brings Lumen back.','Vuelve todo al Windows de origen (barra, fondo, cursores). El acceso del escritorio trae Lumen de vuelta.'),`<button class="btn" data-a="classico">${T('Mudar','Switch','Cambiar')}</button>`)}
   ${item(IC.restart,T('Reiniciar o Lumen','Restart Lumen','Reiniciar Lumen'),T('Fecha e volta a abrir a barra e os painéis.','Closes and reopens the bar and panels.','Cierra y vuelve a abrir la barra y los paneles.'),`<button class="btn" data-a="reiniciar">${T('Reiniciar','Restart','Reiniciar')}</button>`)}
   ${item(IC.folder,T('Pasta das definições','Settings folder','Carpeta de configuración'),'%LOCALAPPDATA%\\Lumen',`<button class="btn" data-a="pasta">${T('Abrir','Open','Abrir')}</button>`)}
  </div>`;},

 sobre(){const a=atual;
  let up=`<button class="btn" data-a="atualizacoes">${svg(IC.restart)}${T('Procurar atualizações','Check for updates','Buscar actualizaciones')}</button>`;
  if(a==='a')up=`<span class="res">${T('A procurar…','Checking…','Buscando…')}</span>`;
  else if(a&&a.ok===false)up=`<span class="res no">${T('Não foi possível verificar: ','Couldn’t check: ','No se pudo comprobar: ')}${esc(a.erro)}</span> `+up;
  else if(a&&a.disponivel)up=`<button class="btn pri" data-a="atualizar">${svg(IC.down)}${T('Instalar a versão ','Install version ','Instalar la versión ')}${esc(a.versao)}</button>`;
  else if(a&&a.prog!=null)up=`<span class="res">${T('A transferir… ','Downloading… ','Descargando… ')}${a.prog}%</span>`;
  else if(a)up=`<span class="res ok">● ${T('Tens a versão mais recente.','You’re up to date.','Tienes la versión más reciente.')}</span>`;
  return `<h1>${T('Sobre o Lumen','About Lumen','Acerca de Lumen')}</h1>
  <div class="card sobre"><img src="../../lumen.png" alt=""><div><div style="font:600 34px/1 'Segoe UI Variable Display','Segoe UI',sans-serif">Lumen</div>
   <div style="color:var(--m);margin:8px 0 16px">${T('Versão','Version','Versión')} ${esc(S.versao)} · © 2026 Gonçalo Leite</div><div class="linha">${up}</div></div></div>
  <h2>${T('Créditos','Credits','Créditos')}</h2><div class="card lista">
   ${item(IC.barra,T('Barra de vidro','Glass bar','Barra de cristal'),T('Baseada no Atrium Desktop, de wynter-yaxley e colaboradores (licença MIT).','Based on Atrium Desktop by wynter-yaxley and contributors (MIT licence).','Basada en Atrium Desktop, de wynter-yaxley y colaboradores (licencia MIT).'),`<a class="lk" data-url="https://github.com/wynter-yaxley/atrium-desktop">GitHub</a>`)}
   ${item(IC.key,T('Licenças','Licences','Licencias'),T('Lumen: MIT. Componentes de terceiros e as suas licenças.','Lumen: MIT. Third-party components and their licences.','Lumen: MIT. Componentes de terceros y sus licencias.'),`<a class="lk" data-a="licencas">${T('Ver','View','Ver')}</a>`)}
   ${item(IC.globe,T('Código e novidades','Source & updates','Código y novedades'),'github.com/Gleite05/Lumen',`<a class="lk" data-url="https://github.com/Gleite05/Lumen">GitHub</a>`)}
  </div>`;}
};

function partir(acao){acao=acao||'';const i=acao.indexOf(':');if(i<0)return['url',acao];return[acao.slice(0,i),acao.slice(i+1)]}
function juntar(tp,vl,host){if(!tp)return'';if(tp==='rdp'&&!vl)vl=host||'';return tp+':'+vl}

// ---------------------------------------------------------------- desenhar
function desenhar(manterScroll){
 if(!S)return;
 const st=$('#main').scrollTop;
 $('#nav').innerHTML=PAGINAS.map(([k,n])=>`<a class="${k===pag?'on':''}" data-ir="${k}">${svg(IC[k])}${n()}</a>`).join('');
 $('#ver').textContent=T('Versão ','Version ','Versión ')+S.versao;
 const ok=S.aCorrer.barra&&S.aCorrer.central;
 $('#rod').innerHTML=`<i class="ponto ${ok?'':'off'}"></i>${ok?T('O Lumen está ativo','Lumen is on','Lumen está activo'):T('O Lumen está parado','Lumen is stopped','Lumen está detenido')}`;
 $('#main').innerHTML=`<div class="pag">${(R[pag]||R.inicio)()}</div>`;
 if(manterScroll)$('#main').scrollTop=st;
 aplicarTema();
}
function ir(p){pag=p;location.hash=p;desenhar(false);$('#main').scrollTop=0;}

// ---------------------------------------------------------------- interação
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-ir],[data-a],[data-tema],[data-fundo],[data-cursor],[data-painel],[data-dia],[data-rmh],[data-rmf],[data-cfg],[data-barra],[data-teste],[data-mv],[data-rms],[data-mva],[data-rma],[data-ic],[data-url]');
 if(!el)return;const c=S.cfg,d=el.dataset;
 if(d.ir){ir(d.ir);return}
 if(d.url){post({acao:'abrir',alvo:d.url});return}
 if(d.tema){c.tema=d.tema;mudou();desenhar(true);return}
 if(d.fundo){c.fundo=d.fundo;mudou();desenhar(true);return}
 if(d.cursor){c.cursores=d.cursor;mudou();desenhar(true);aviso(T('Cursores aplicados','Cursors applied','Cursores aplicados'));return}
 if(d.painel){c.paineis=c.paineis||{};c.paineis[d.painel]=c.paineis[d.painel]===false;mudou();desenhar(true);return}
 if(d.dia!=null){const n=+d.dia;c.dias=c.dias||[];c.dias=c.dias.includes(n)?c.dias.filter(x=>x!==n):c.dias.concat(n).sort();mudou();desenhar(true);return}
 if(d.rmh!=null){c.horario.splice(+d.rmh,1);mudou();desenhar(true);return}
 if(d.rmf){c.feriados=(c.feriados||[]).filter(x=>x!==d.rmf);mudou();desenhar(true);return}
 if(d.cfg){c[d.cfg]=c[d.cfg]===false;mudou();desenhar(true);return}
 if(d.barra){S.barra[d.barra]=!S.barra[d.barra];post({acao:'barra',chave:d.barra,valor:S.barra[d.barra]});desenhar(true);return}
 if(d.teste!=null){const s=c.servidores[+d.teste];testes['s'+d.teste]=null;post({acao:'testar',id:'s'+d.teste,host:s.host,porta:String(s.porta||'')});el.innerHTML=svg(IC.pulse)+T('A testar…','Testing…','Probando…');return}
 if(d.mv!=null||d.mva!=null){const l=d.mv!=null?c.servidores:c.atalhos,i=+(d.mv??d.mva),j=i+(+d.d);if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];testes={};mudou();desenhar(true);return}
 if(d.rms!=null){c.servidores.splice(+d.rms,1);testes={};mudou();desenhar(true);return}
 if(d.rma!=null){c.atalhos.splice(+d.rma,1);mudou();desenhar(true);return}
 if(d.ic!=null){c.atalhos[+d.ic].icone=d.v;mudou();desenhar(true);return}
 switch(d.a){
  case 'definicoesBarra':case 'classico':case 'pasta':case 'licencas':post({acao:'abrir',alvo:d.a});break;
  case 'reiniciar':post({acao:'reiniciar'});break;
  case 'arranque':S.arranque=!S.arranque;post({acao:'arranque',ligado:S.arranque?'True':'False'});desenhar(true);break;
  case 'addh':c.horario=c.horario||[];c.horario.push(['14:00','18:00']);mudou();desenhar(true);break;
  case 'addf':{const v=$('#novoFer').value;if(v){c.feriados=c.feriados||[];if(!c.feriados.includes(v))c.feriados.push(v);mudou();desenhar(true);}break;}
  case 'adds':c.servidores=c.servidores||[];c.servidores.push({nome:'',sub:'',host:'',porta:'',acao:'rdp:'});mudou();desenhar(true);setTimeout(()=>{const l=document.querySelectorAll('[data-f=nome]');if(l.length)l[l.length-1].focus()},30);break;
  case 'adda':c.atalhos=c.atalhos||[];c.atalhos.push({nome:'',icone:'globe',acao:'url:https://'});mudou();desenhar(true);break;
  case 'atualizacoes':atual='a';desenhar(true);post({acao:'atualizacoes'});break;
  case 'atualizar':post({acao:'atualizar',url:atual.url});atual={prog:0};desenhar(true);break;
 }
});
document.addEventListener('input',e=>{
 const el=e.target,d=el.dataset,c=S.cfg;
 if(d.h!=null){c.horario[+d.h][+d.k]=el.value;mudou();aplicarTema();return}
 if(d.s!=null){const s=c.servidores[+d.s];let [tp,vl]=partir(s.acao);
  if(d.f==='tipo'){tp=el.value;s.acao=juntar(tp,'',s.host);mudou();desenhar(true);return}
  if(d.f==='valor'){s.acao=juntar(tp,el.value,s.host);}
  else{s[d.f]=d.f==='porta'?(el.value?+el.value:''):el.value;}
  mudou();return}
 if(d.at!=null){const a=c.atalhos[+d.at];let [tp,vl]=partir(a.acao);
  if(d.f==='tipo'){a.acao=el.value+':'+(el.value==='url'?'https://':'');mudou();desenhar(true);return}
  if(d.f==='valor')a.acao=tp+':'+el.value;else a[d.f]=el.value;mudou();return}
 if(d.cfgsel){c[d.cfgsel]=el.value;if(d.cfgsel==='idioma'){L=el.value==='auto'?(navigator.language||'pt').slice(0,2):el.value.slice(0,2);if(!['pt','en','es'].includes(L))L='en';}mudou();desenhar(true);}
});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input'))e.preventDefault()});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p&&p!==pag&&R[p]){pag=p;desenhar(false)}});

window.chrome.webview.addEventListener('message',e=>{const m=e.data;
 switch(m.tipo){
  case 'estado':S=m.dados;L=S.lingua||'pt';document.documentElement.lang=L;S.cfg.paineis=S.cfg.paineis||{};desenhar(true);break;
  case 'gravado':aviso(T('Guardado','Saved','Guardado'));break;
  case 'ocupado':$('#ocupado').classList.toggle('on',!!m.dados);break;
  case 'teste':testes[m.dados.id]=m.dados;if(pag==='servidores')desenhar(true);break;
  case 'atualizacao':atual=m.dados;if(pag==='sobre')desenhar(true);break;
  case 'progresso':atual={prog:m.dados};if(pag==='sobre')desenhar(true);break;
 }});
setInterval(()=>{if(S&&pag==='inicio'&&!document.activeElement.matches('input,select'))desenhar(true)},60000);
post({acao:'pronto'});
</script></body></html>
